# SPDX-License-Identifier: MIT
# Crewbook by Hai Nguyen (github.com/liquizzz/crewbook-build)
# image-app: builds the product image only when the app or its Docker file changes, plus every release tag.
#   push to staging  ->  :staging, :staging-<sha>   (regression and owner acceptance run on this)
#   tag vX.Y.Z       ->  :vX.Y.Z, :latest           (what you deploy; roll back by running an older tag)
#                        plus an SBOM (list of every library in the image) as a run artifact, and on public
#                        repos a signed provenance attestation: check it with gh attestation verify oci://<image> -R <repo>
# The work in progress on dev is built on the machine instead (node scripts/run.mjs dev), to save minutes.
# Deploying the image to your own servers is up to you and is not part of this workflow.
# Skipped when the repo variable CI_MODE is local (scripts/ci-mode.mjs): a skipped job uses no Actions minutes.
name: image-app

on:
  push:
    branches: [staging]
    paths:
      - "app/**"
      - "packages/**"
      - "docker/app.Dockerfile"
      - "package*.json"
      - "pnpm-lock.yaml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    if: ${{ vars.CI_MODE != 'local' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-app
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,enable=${{ startsWith(github.ref, 'refs/heads/') }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - name: Image name in lower case
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-app" >> "$GITHUB_OUTPUT"
      - name: Provenance attestation (public repos)
        if: startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: SBOM of the release image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: anchore/sbom-action@v0
        with:
          image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: spdx-json
          # Keep the SBOM as a run artifact; attaching it to the GitHub release needs contents: write.
          upload-release-assets: false
          artifact-name: sbom-${{ github.ref_name }}.spdx.json
