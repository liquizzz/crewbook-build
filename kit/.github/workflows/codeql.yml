# SPDX-License-Identifier: MIT
# Crewbook by Hai Nguyen (github.com/liquizzz/crewbook-build)
# codeql: static security analysis of the code. Findings show in the repo's Security tab and on PRs.
# Runs once the Lead sets the repo variable during setup, e.g.
#   gh variable set CODEQL_LANGUAGES --body "javascript-typescript"
# Free on public repos; on private repos it needs GitHub Code Security, so it is skipped there.
# Runs on main (each release) and once a week, to save minutes.
# Skipped when the repo variable CI_MODE is local (scripts/ci-mode.mjs): a skipped job uses no Actions minutes.
name: codeql

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    if: ${{ !github.event.repository.private && vars.CODEQL_LANGUAGES != '' && vars.CI_MODE != 'local' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ vars.CODEQL_LANGUAGES }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
