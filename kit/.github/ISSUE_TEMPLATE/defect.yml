name: Defect
description: A defect found in testing or in production.
title: "Defect: <short description>"
labels: ["defect", "type:fix"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity (add the matching sev:* label)
      options:
        - "sev:high: main function blocked, data loss, wrong money, security"
        - "sev:medium: function wrong, a workaround exists"
        - "sev:low: cosmetic or minor"
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options: [local, dev, staging, production]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "v1.4.0 or staging @ a1b2c3d"
    validations:
      required: true
  - type: input
    id: caused
    attributes:
      label: Caused by
      description: The task and its PR that brought the defect in (from the area and the git history), or "unknown". It goes to the role that made that task.
      placeholder: "#42 (PR #58)"
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: Change level of the fix (add the matching L* label)
      description: Set by the fix's own risk (rule "Change level"), not copied from the task; data loss, permissions, money or personal data are L3.
      options: ["L0 Display", "L1 Setting or small logic", "L2 Module logic", "L3 Core"]
    validations:
      required: true
  - type: input
    id: fr
    attributes:
      label: Related requirement
      placeholder: "FR-021"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Screenshots or logs if useful. Never paste secrets.
    validations:
      required: true
