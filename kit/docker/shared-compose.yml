# SPDX-License-Identifier: MIT
# Crewbook by Hai Nguyen (github.com/liquizzz/crewbook-build)
#
# The services one machine shares across projects (node scripts/hosts.mjs shared up <service>): a registry on the LAN.
# Databases and caches are not here: each project runs its own in Docker or connects to a server you already have
# (scripts/db-setup.mjs).
name: crewbook-shared

services:
  registry:
    profiles: ["registry"]
    # A registry on the LAN, for projects that do not push to GHCR. Servers only pull from it.
    image: registry:2
    ports: ["5000:5000"]
    volumes: ["registry:/var/lib/registry"]
    restart: unless-stopped

volumes:
  registry:
