# SPDX-License-Identifier: MIT
# Crewbook by Hai Nguyen (github.com/liquizzz/crewbook-build)
#
# Runs the project with Docker. Copy to the repo root as docker-compose.yml and adapt.
#   A released version, the easy way: node scripts/run.mjs v1.4.0   (pulls, starts, waits until healthy, opens the browser)
#   Local, from source:        docker compose up --build
#   A released version:        IMAGE_TAG=v1.4.0 docker compose up --no-build --wait
#   Only the design prototype: docker compose up design
# Each service has a healthcheck, so "--wait" (and run.mjs) return only when the app answers. The check uses wget,
# which alpine and nginx images have; for an image without it, the Lead swaps in curl or the runtime itself at setup.
# One image per layer when the UI is its own app: rename app to api and add web (below); list them under "images" in
# .claude/project.json. Databases, Redis and model servers are not here: they run once per machine (crewbook-shared,
# node scripts/hosts.mjs) and each environment reaches them through its connection string in .env.local.
# REGISTRY: where images are pushed and pulled ("registry" in .claude/project.json or ~/.crewbook/hosts.json).
# Where and how you run it beyond your machine (servers, cloud, domains, TLS) is your own choice.
name: <project>

services:
  # design:start (the UI/UX prototype; it starts only when named, "docker compose up design", or with --profile design)
  design:
    # UI/UX prototype shown to the client. Built only from design/ and packages/tokens/.
    profiles: ["design"]
    image: ${REGISTRY:-ghcr.io/<owner>}/<project>-design:${DESIGN_TAG:-dev}
    build:
      context: .
      dockerfile: docker/design.Dockerfile
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
  # design:end

  app:
    # The product.
    image: ${REGISTRY:-ghcr.io/<owner>}/<project>-app:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    env_file:
      - path: .env.local
        required: false
    ports:
      - "3000:3000"
    healthcheck:
      # Any page that answers 200 when the app is ready; point it at a /health route once the app has one.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    # depends_on: [db]

  # web:
  #   # The frontend, when it is its own app (static files behind nginx).
  #   image: ${REGISTRY:-ghcr.io/<owner>}/<project>-web:${IMAGE_TAG:-dev}
  #   build:
  #     context: .
  #     dockerfile: docker/web.Dockerfile
  #   ports:
  #     - "3001:80"

  # A database for a project that cannot use the shared server (a client's rule):
  # db:
